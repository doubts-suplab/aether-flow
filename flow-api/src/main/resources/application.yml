spring:
  application:
    name: aether-flow
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aether_flow}
    username: ${POSTGRES_USER:aether}
    password: ${POSTGRES_PASSWORD:aether}
  flyway:
    enabled: true
    locations: classpath:db/migration
  # SMTP — only used when aether.flow.notification.email.to is set.
  # Host/port/credentials come from the environment; secrets never committed to source.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

aether:
  flow:
    deferral:
      sla-minutes: ${FLOW_DEFERRAL_SLA_MINUTES:60}
    escalation:
      enabled: ${FLOW_ESCALATION_ENABLED:true}
      cron: ${FLOW_ESCALATION_CRON:0 */5 * * * *}
    notification:
      webhook:
        url: ${FLOW_NOTIFICATION_WEBHOOK_URL:}
        timeout-seconds: ${FLOW_NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:10}
      email:
        to: ${FLOW_NOTIFICATION_EMAIL_TO:}
        from: ${FLOW_NOTIFICATION_EMAIL_FROM:aether-flow@localhost}
