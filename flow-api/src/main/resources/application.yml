spring:
  application:
    name: aether-flow
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aether_flow}
    username: ${POSTGRES_USER:aether}
    password: ${POSTGRES_PASSWORD:aether}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

aether:
  flow:
    deferral:
      sla-minutes: ${FLOW_DEFERRAL_SLA_MINUTES:60}
    escalation:
      enabled: ${FLOW_ESCALATION_ENABLED:true}
      cron: ${FLOW_ESCALATION_CRON:0 */5 * * * *}
