# EEIK Project Manifest — Aether Flow
# Generated from eeik-bootstrap manifest-template.yaml
# Repo: suplab/aether-flow

project:
  name: aether-flow
  description: >
    Workflow orchestration platform for the Aether ecosystem. Defines BPMN-style multi-step
    human-AI processes, drives running instances through a persisted state machine, enforces
    configurable human approval gates with SLAs and escalation, and receives DEFER decisions
    from Aether Grid into approval queues. Workflow state survives service restarts.
  owning_team: suplab
  business_domain: generic
  project_type: workflow-platform

technology:
  backend:
    language: java
    version: "21"
    framework: spring-boot
    framework_version: "3.3.x"
  database:
    type: postgresql
    version: "16"
    migration_tool: flyway
    orm: spring-data-jdbc

architecture:
  style: modular-monolith
  runnable_applications:
    - name: flow-api
      role: platform-api
      port: 8085
  design_patterns:
    - hexagonal-architecture
    - domain-driven-design
    - state-machine
    - human-in-the-loop
  api_style: rest

capabilities:
  owns:
    - workflows
  detail:
    - process-orchestration
    - human-approval-steps
    - state-persistence
    - grid-defer-integration

memory:
  memory_pattern: none
  scope_key: tenant-and-workflow

governance:
  profile: enterprise
  multi_tenancy: tenant-and-workflow-scoped
  compliance:
    - GDPR

observability:
  logging: slf4j-structured
  metrics: micrometer-prometheus

delivery:
  team_structure: solo
  methodology: incremental
  cicd_platform: github-actions
  branch_strategy: feature-branches
  commit_convention: conventional-commits

ecosystem:
  layer: platform
  consumes:
    - aether-grid
  consumed_by:
    - aether-enterprise
  sibling_repositories:
    - suplab/aether
    - suplab/aether-core
    - suplab/aether-grid
    - suplab/aether-memory
    - suplab/aether-vault

bootstrap:
  source: eeik-bootstrap
  source_repo: suplab/eeik-bootstrap
  capability_packs_activated:
    - java
    - architecture
    - governance
