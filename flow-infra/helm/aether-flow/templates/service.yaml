apiVersion: v1
kind: Service
metadata:
  name: aether-flow
  namespace: {{ include "aether-flow.namespace" . }}
  labels:
    {{- include "aether-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aether-flow
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      protocol: TCP
