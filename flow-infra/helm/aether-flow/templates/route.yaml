{{- if .Values.openshift.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aether-flow
  namespace: {{ include "aether-flow.namespace" . }}
  labels:
    {{- include "aether-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-engine
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: aether-flow
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.insecureEdgeTerminationPolicy }}
  wildcardPolicy: None
{{- end }}
