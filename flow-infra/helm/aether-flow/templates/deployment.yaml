apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-flow
  namespace: {{ include "aether-flow.namespace" . }}
  labels:
    {{- include "aether-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-engine
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aether-flow
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aether-flow
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/part-of: aether-flow
        app.kubernetes.io/component: workflow-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aether-flow.app.serviceAccountName" . }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aether-flow
              app.kubernetes.io/instance: {{ .Release.Name }}

      containers:
        - name: aether-flow
          image: {{ include "aether-flow.app.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            {{- if not .Values.openshift.enabled }}
            runAsUser: 1000
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

          env:
            # ── Secrets ───────────────────────────────────────────────────────
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-url
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-password
            # Optional — present only when the email notifier is configured.
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: mail-username
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: mail-password
                  optional: true
            # ── ConfigMap ─────────────────────────────────────────────────────
            - name: FLOW_ESCALATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: escalation-enabled
            - name: FLOW_ESCALATION_CRON
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: escalation-cron
            - name: FLOW_DEFERRAL_SLA_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: deferral-sla-minutes
            - name: FLOW_GRID_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: grid-callback-url
            - name: FLOW_GRID_AGENT_URL
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: grid-agent-url
            - name: FLOW_NOTIFICATION_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: notification-webhook-url
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: aether-flow-config
                  key: spring-profiles-active

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
