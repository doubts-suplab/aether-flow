services:
  postgres-flow:
    image: postgres:16
    environment:
      POSTGRES_DB: aether_flow
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-flow-data:/var/lib/postgresql/data

  aether-flow:
    build:
      context: ../..
      dockerfile: flow-api/Dockerfile
    ports:
      - "8085:8085"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres-flow:5432/aether_flow
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres-flow:
        condition: service_healthy

volumes:
  postgres-flow-data:
